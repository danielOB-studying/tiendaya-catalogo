<div class="app-container">
  <button type="button" (click)="back()">Volver al listado</button>

  <div *ngIf="loading" class="info">Cargando producto...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="product && !loading" class="detail-card">
    <h2>{{ product.name }}</h2>
    <p><strong>Categoría:</strong> {{ product.category }}</p>
    <p><strong>Precio:</strong> {{ product.price | currency:'USD':'symbol':'1.0-0' }}</p>
    <p><strong>Stock:</strong> {{ product.stock }}</p>
    <p><strong>Activo:</strong> {{ product.active ? 'Sí' : 'No' }}</p>
    <p><strong>Stock bajo:</strong> {{ product.lowStock ? 'Sí' : 'No' }}</p>
    <button type="button" (click)="edit()">Editar producto</button>
    <button type="button" class="danger" (click)="delete()">Eliminar</button>
  </div>
</div>
